<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e11d48" />
    <title>ReachInbox - Email Scheduler</title>
    <style>
      /* Pre-React splash: shown until the bundle loads and React mounts. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #64748b;
      }
      .app-splash__mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #e11d48;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
      }
      .app-splash__spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #fecdd3;
        border-top-color: #e11d48;
        animation: app-spin 0.8s linear infinite;
      }
      .app-splash__label {
        font-size: 14px;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash__mark">R</div>
        <div class="app-splash__spinner"></div>
        <div class="app-splash__label">Loading ReachInbox…</div>
      </div>
    </div>
    <noscript>
      <p style="text-align: center; font-family: sans-serif; padding: 24px">
        ReachInbox needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
